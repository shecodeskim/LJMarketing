<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="Your wishlist - L&J Marketing Kenya digital products shop.">
<title>Wishlist | L&J Marketing Kenya</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;0,700;1,400;1,600&family=Outfit:wght@300;400;500;600;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{--navy:#0B1F3A;--navy-mid:#142A4E;--gold:#C9A84C;--gold-light:#E2C97E;--gold-pale:#F5E9C8;--black:#080C12;--white:#FAFAF8;--offwhite:#F2F0EB;--grey:#E5E2DB;--text:#1A1A2E;--muted:#6B6860;}
*{margin:0;padding:0;box-sizing:border-box;}
html{scroll-behavior:smooth;}
body{background:var(--white);color:var(--text);font-family:'Outfit',sans-serif;line-height:1.6;overflow-x:hidden;}
a{text-decoration:none;color:inherit;}
.container{max-width:1100px;margin:0 auto;padding:0 24px;}

nav{position:fixed;top:0;left:0;right:0;z-index:1000;padding:0 24px;background:rgba(8,12,18,0.95);backdrop-filter:blur(16px);border-bottom:1px solid rgba(201,168,76,0.15);}
.nav-inner{max-width:1100px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;height:68px;}
.nav-logo{display:flex;align-items:center;gap:12px;}
.nav-badge{width:40px;height:40px;border-radius:50%;background:var(--black);border:1.5px solid var(--gold);display:flex;align-items:center;justify-content:center;}
.nav-monogram{font-family:'Cormorant Garamond',serif;font-size:16px;font-weight:700;color:var(--white);}
.nav-monogram span{color:var(--gold);}
.nav-name{font-family:'Cormorant Garamond',serif;font-size:15px;font-weight:700;color:var(--white);}
.nav-name span{color:var(--gold);}
.nav-sub{font-size:9px;font-weight:500;letter-spacing:2.5px;text-transform:uppercase;color:rgba(250,250,248,0.4);margin-top:2px;}
.nav-links{display:flex;align-items:center;gap:6px;list-style:none;}
.nav-links a{font-size:12px;font-weight:500;color:rgba(250,250,248,0.65);padding:8px 12px;border-radius:6px;transition:all 0.2s;}
.nav-links a:hover,.nav-links a.active{color:var(--gold);}
.nav-cta{background:var(--gold)!important;color:var(--navy)!important;font-weight:700!important;border-radius:8px!important;padding:9px 18px!important;}
.nav-icons{display:flex;align-items:center;gap:12px;}
.nav-icon-btn{position:relative;background:none;border:none;color:rgba(250,250,248,0.65);cursor:pointer;padding:8px;font-size:18px;transition:color 0.2s;}
.nav-icon-btn:hover{color:var(--gold);}
.cart-badge{position:absolute;top:4px;right:4px;background:var(--gold);color:var(--navy);font-size:10px;font-weight:700;padding:2px 6px;border-radius:10px;min-width:18px;text-align:center;}
.admin-dropdown{position:relative;}
.admin-dropdown-btn{display:flex;align-items:center;gap:4px;cursor:pointer;}
.admin-dropdown-btn::after{content:'▼';font-size:8px;margin-left:4px;}
.admin-menu{position:absolute;top:100%;right:0;background:var(--black);border:1px solid rgba(201,168,76,0.2);border-radius:8px;padding:8px 0;min-width:180px;display:none;z-index:1001;box-shadow:0 8px 32px rgba(0,0,0,0.4);}
.admin-menu.show{display:block;}
.admin-menu a{display:block;padding:10px 16px;font-size:12px;color:rgba(250,250,248,0.8);transition:all 0.2s;}
.admin-menu a:hover{background:rgba(201,168,76,0.1);color:var(--gold);}
.admin-menu .admin-divider{height:1px;background:rgba(255,255,255,0.1);margin:8px 0;}

.page-header{background:var(--navy);padding:140px 0 80px;position:relative;overflow:hidden;}
.page-header::before{content:'';position:absolute;top:-100px;right:-100px;width:500px;height:500px;border-radius:50%;background:radial-gradient(circle,rgba(201,168,76,0.05) 0%,transparent 70%);}
.ph-grid{position:absolute;inset:0;background-image:linear-gradient(rgba(201,168,76,0.03) 1px,transparent 1px),linear-gradient(90deg,rgba(201,168,76,0.03) 1px,transparent 1px);background-size:60px 60px;}
.ph-inner{position:relative;z-index:1;}
.ph-tag{font-size:10px;font-weight:700;letter-spacing:4px;text-transform:uppercase;color:var(--gold);margin-bottom:14px;display:flex;align-items:center;gap:10px;}
.ph-tag::before{content:'';width:24px;height:1px;background:var(--gold);}
.ph-h{font-family:'Cormorant Garamond',serif;font-size:clamp(36px,7vw,62px);font-weight:700;color:var(--white);line-height:1.05;margin-bottom:16px;}

.wishlist-page{padding:60px 0;}
.wishlist-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:20px;}
.product-card{background:white;border-radius:16px;overflow:hidden;box-shadow:0 2px 20px rgba(11,31,58,0.08);border:1px solid var(--grey);transition:all 0.3s;display:flex;flex-direction:column;}
.product-card:hover{transform:translateY(-6px);box-shadow:0 16px 48px rgba(11,31,58,0.15);border-color:var(--gold);}
.product-top{padding:28px 24px 20px;background:linear-gradient(135deg,var(--navy) 0%,var(--navy-mid) 100%);}
.product-icon{font-size:32px;margin-bottom:12px;}
.product-badge{display:inline-block;font-size:9px;font-weight:700;letter-spacing:2px;text-transform:uppercase;padding:4px 10px;border-radius:20px;background:rgba(201,168,76,0.2);color:var(--gold);margin-bottom:10px;}
.product-name{font-family:'Cormorant Garamond',serif;font-size:20px;font-weight:700;color:var(--white);line-height:1.2;}
.product-body{padding:20px 24px;flex:1;display:flex;flex-direction:column;}
.product-desc{font-size:13.5px;color:var(--muted);line-height:1.7;margin-bottom:16px;font-weight:300;flex:1;}
.product-footer{display:flex;align-items:center;justify-content:space-between;padding-top:16px;border-top:1px solid var(--grey);}
.product-price{font-family:'Space Mono',monospace;font-size:18px;font-weight:700;color:var(--navy);}
.product-actions{display:flex;gap:8px;}
.buy-btn{background:var(--navy);color:var(--gold);font-size:12px;font-weight:700;letter-spacing:0.5px;padding:10px 20px;border-radius:8px;border:none;cursor:pointer;transition:all 0.2s;}
.buy-btn:hover{background:var(--navy-mid);transform:translateY(-1px);}
.wishlist-btn{background:transparent;border:1.5px solid var(--grey);color:var(--muted);font-size:16px;padding:10px 14px;border-radius:8px;cursor:pointer;transition:all 0.2s;}
.wishlist-btn:hover{border-color:#DC5050;color:#DC5050;}
.wishlist-btn.active{border-color:#DC5050;color:#DC5050;}

.empty-wishlist{text-align:center;padding:80px 20px;background:var(--offwhite);border-radius:16px;}
.empty-icon{font-size:64px;margin-bottom:16px;}
.empty-title{font-family:'Cormorant Garamond',serif;font-size:24px;font-weight:700;color:var(--navy);margin-bottom:8px;}
.empty-desc{font-size:14px;color:var(--muted);margin-bottom:24px;}
.continue-btn{display:inline-flex;align-items:center;gap:8px;background:var(--navy);color:var(--gold);font-size:13px;font-weight:700;padding:14px 28px;border-radius:8px;border:none;cursor:pointer;transition:all 0.2s;}
.continue-btn:hover{background:var(--navy-mid);}

.wa-float{position:fixed;bottom:28px;right:24px;z-index:900;width:56px;height:56px;border-radius:50%;background:#25D366;display:flex;align-items:center;justify-content:center;font-size:26px;box-shadow:0 4px 20px rgba(37,211,102,0.4);transition:all 0.25s;animation:waFloat 3s ease-in-out infinite;}
.wa-float:hover{transform:scale(1.1);}
@keyframes waFloat{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}

@media(max-width:600px){
  .wishlist-grid{grid-template-columns:1fr;}
}
</style>
</head>
<body>

<nav>
  <div class="nav-inner">
    <a href="index.html" class="nav-logo">
      <div class="nav-badge"><div class="nav-monogram">L<span>&</span>J</div></div>
      <div>
        <div class="nav-name">L<span>&</span>J Marketing Kenya</div>
        <div class="nav-sub">Nairobi · Est. 2024</div>
      </div>
    </a>
    <ul class="nav-links">
      <li><a href="index.html">Home</a></li>
      <li><a href="shop.html">Shop</a></li>
      <li><a href="contact.html">Contact</a></li>
      <li class="admin-dropdown" id="admin-dropdown" style="display:none;">
        <span class="nav-cta admin-dropdown-btn" onclick="toggleAdminMenu()">Admin ▼</span>
        <div class="admin-menu" id="admin-menu">
          <a href="admin.html">📦 Add Products</a>
          <a href="account.html">👤 My Account</a>
          <div class="admin-divider"></div>
          <a href="#" onclick="handleLogout()">🚪 Logout</a>
        </div>
      </li>
      <li id="customer-logout" style="display:none;"><a href="#" onclick="handleLogout()" class="nav-cta">Logout</a></li>
    </ul>
    <div class="nav-icons">
      <button class="nav-icon-btn" onclick="window.location.href='wishlist.html'" title="Wishlist">♡</button>
      <button class="nav-icon-btn" onclick="window.location.href='cart.html'" title="Cart">
        🛒
        <span class="cart-badge" id="cart-count">0</span>
      </button>
    </div>
  </div>
</nav>

<div class="page-header">
  <div class="ph-grid"></div>
  <div class="container ph-inner">
    <div class="ph-tag">Shop</div>
    <h1 class="ph-h">Your Wishlist</h1>
  </div>
</div>

<div class="wishlist-page">
  <div class="container">
    <div id="empty-wishlist" class="empty-wishlist" style="display:none;">
      <div class="empty-icon">♡</div>
      <h2 class="empty-title">Your wishlist is empty</h2>
      <p class="empty-desc">Save products you love by clicking the heart icon.</p>
      <a href="shop.html" class="continue-btn">Browse Products →</a>
    </div>

    <div class="wishlist-grid" id="wishlist-content" style="display:none;"></div>
  </div>
</div>

<a href="https://wa.me/254740788160" class="wa-float" target="_blank">💬</a>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
  const sb = supabase.createClient('https://wzjxazdksgjrhjycocpw.supabase.co', 'sb_publishable_opqpZEV2qXCtyhZ8stvzvg_HRzKlicl');

  let products = {};
  let wishlist = JSON.parse(localStorage.getItem('wishlist')) || [];
  let cart = JSON.parse(localStorage.getItem('cart')) || [];

  async function loadProducts() {
    const { data: productsData } = await sb.from('products').select('*');
    
    if (productsData) {
      productsData.forEach(p => {
        products[p.id] = p;
      });
    }
    
    renderWishlist();
  }

  function renderWishlist() {
    const wishlistContent = document.getElementById('wishlist-content');
    const emptyWishlist = document.getElementById('empty-wishlist');
    const cartCount = document.getElementById('cart-count');

    cartCount.textContent = cart.length;

    if (wishlist.length === 0) {
      emptyWishlist.style.display = 'block';
      wishlistContent.style.display = 'none';
      return;
    }

    emptyWishlist.style.display = 'none';
    wishlistContent.style.display = 'grid';

    wishlistContent.innerHTML = wishlist.map(productId => {
      const product = products[productId];
      if (!product) return '';
      return `
        <div class="product-card">
          <div class="product-top">
            <div class="product-icon">${product.icon}</div>
            <div class="product-badge">${product.badge}</div>
            <div class="product-name">${product.name}</div>
          </div>
          <div class="product-body">
            <div class="product-desc">${product.description}</div>
            <div class="product-footer">
              <div class="product-price">KES ${product.price.toLocaleString()}</div>
              <div class="product-actions">
                <button class="wishlist-btn active" onclick="removeFromWishlist('${productId}')" title="Remove from wishlist">♥</button>
                <button class="buy-btn" onclick="addToCart('${productId}')">Add to Cart</button>
              </div>
            </div>
          </div>
        </div>
      `;
    }).join('');
  }

  function removeFromWishlist(productId) {
    const index = wishlist.indexOf(productId);
    if (index > -1) {
      wishlist.splice(index, 1);
      localStorage.setItem('wishlist', JSON.stringify(wishlist));
      renderWishlist();
    }
  }

  function addToCart(productId) {
    const existingItem = cart.find(item => item.id === productId);
    if (existingItem) {
      alert('This item is already in your cart!');
      return;
    }
    const product = products[productId];
    cart.push({ id: productId, name: product.name, price: product.price });
    localStorage.setItem('cart', JSON.stringify(cart));
    document.getElementById('cart-count').textContent = cart.length;
    alert('Added to cart!');
  }

  loadProducts();

function toggleAdminMenu() {
  const menu = document.getElementById('admin-menu');
  menu.classList.toggle('show');
}

// Close dropdown when clicking outside
document.addEventListener('click', (e) => {
  const dropdown = document.getElementById('admin-dropdown');
  if (dropdown && !dropdown.contains(e.target)) {
    document.getElementById('admin-menu').classList.remove('show');
  }
});

// Check user role on page load
async function checkUserRole() {
  const { data: { user } } = await sb.auth.getUser();
  
  if (user) {
    const { data: profile } = await sb.from('profiles').select('*').eq('id', user.id).single();
    
    if (profile && profile.role === 'admin') {
      document.getElementById('admin-dropdown').style.display = 'block';
    } else {
      document.getElementById('customer-logout').style.display = 'block';
    }
  }
}

async function handleLogout() {
  await sb.auth.signOut();
  window.location.href = 'login.html';
}

checkUserRole();
</script>
</body>
</html>
